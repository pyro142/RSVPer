<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>Settings · RSVP admin</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/vendor/fonts/fonts.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <script src="/js/theme-init.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-names" data-couple></span>
          <span class="brand-sub">Settings</span>
        </div>
        <nav class="topbar-actions" aria-label="Admin">
          <a class="btn btn-ghost" href="/admin">Dashboard</a>
          <a class="btn btn-ghost" href="/" target="_blank" rel="noopener">View invitation</a>
          <a class="btn btn-ghost" href="/admin/login" id="signOut">Sign out</a>
          <button type="button" class="theme-btn" id="themeToggle" aria-pressed="false">
            <span class="sr-only" id="themeToggleLabel">Switch to dark mode</span>
          </button>
        </nav>
      </div>
    </header>

    <main class="wrap settings-layout">
      <div id="warnings" class="banners" hidden></div>
      <nav class="settings-nav" id="settingsNav" aria-label="Settings sections"></nav>
      <div class="settings-panels" id="settingsPanels">
        <p class="table-status">Loading…</p>
      </div>
    </main>

    <script src="/js/admin/common.js"></script>
    <script src="/js/admin/fields.js"></script>
    <script src="/js/admin/menu.js"></script>
    <script src="/js/admin/turnstile.js"></script>
    <script src="/js/admin/colours.js"></script>
    <script src="/js/admin/settings.js"></script>
  </body>
</html>
