<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="referrer" content="no-referrer" />
    <title>Settings · RSVP admin</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/vendor/fonts/fonts.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <script src="/js/theme-init.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-names" data-couple></span>
          <span class="brand-sub">Settings</span>
        </div>
        <nav class="topbar-actions" aria-label="Admin">
          <a class="nav-link" href="/admin">Dashboard</a>
          <a class="nav-link" href="/admin/settings" aria-current="page">Settings</a>
          <a class="nav-link" href="/" target="_blank" rel="noopener"
            ><span class="nav-long">View invitation</span
            ><span class="nav-short">Invitation</span></a
          >
          <span class="nav-sep" aria-hidden="true"></span>
          <a class="nav-link" href="/admin/login" id="signOut">Sign out</a>
          <button type="button" class="theme-btn" id="themeToggle" aria-pressed="false">
            <span class="sr-only" id="themeToggleLabel">Switch to dark mode</span>
          </button>
        </nav>
      </div>
    </header>

    <main class="wrap settings-layout">
      <div id="warnings" class="banners" hidden></div>
      <nav class="settings-nav" id="settingsNav" aria-label="Settings sections"></nav>
      <div class="settings-panels" id="settingsPanels">
        <p class="table-status">Loading…</p>
      </div>

      <aside class="live-preview" id="livePreview" aria-label="Live preview of your invitation">
        <div class="preview-head">
          <span class="preview-title">Live preview</span>
          <div class="preview-toggle" role="group" aria-label="Preview as">
            <button type="button" class="active" data-preview-as="day">Day guest</button>
            <button type="button" data-preview-as="evening" id="previewEveningBtn">
              Evening guest
            </button>
          </div>
          <button type="button" class="preview-close" data-preview-close aria-label="Close preview">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6 6l12 12M18 6L6 18"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
        <div class="phone-frame">
          <iframe
            id="previewFrame"
            src="/admin/preview"
            title="Preview of your invitation as a guest would see it"
          ></iframe>
        </div>
        <p class="field-hint">Shows unsaved changes too. Nothing here is saved or sent.</p>
      </aside>
      <button
        type="button"
        class="btn btn-primary preview-fab"
        id="previewToggle"
        aria-expanded="false"
        aria-controls="livePreview"
      >
        Preview
      </button>
    </main>

    <script src="/js/admin/common.js"></script>
    <script src="/js/admin/fields.js"></script>
    <script src="/js/admin/menu.js"></script>
    <script src="/js/admin/turnstile.js"></script>
    <script src="/js/admin/colours.js"></script>
    <script src="/js/admin/preview-pane.js"></script>
    <script src="/js/admin/settings.js"></script>
  </body>
</html>
