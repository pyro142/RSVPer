name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **don't include real names, guest lists, links, codes or keys**. Use made-up examples.
        Found a security problem? Please report it privately instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Guest invitation page
        - Admin dashboard
        - Admin settings or setup wizard
        - Deploying (button or Wrangler)
        - Local development
        - Something else
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari / Windows 11, Chrome
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you're running, if you know it.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots (with personal details hidden), error messages, logs.
