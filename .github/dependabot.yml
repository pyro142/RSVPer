version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint only supports TypeScript < 6.1. Allow minor/patch
      # updates, but hold back new TypeScript majors until typescript-eslint
      # adds support; then remove this rule.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
